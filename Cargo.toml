[package]
name = "vozz-g2p-rs"
version = "0.1.0"
edition = "2021"
description = "Conversor grafema→fonema pt-BR em Rust, baseado no Vozz"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
regex = "1"
unicode-normalization = "0.1"


[lib]
name = "vozz_g2p_rs"
path = "src/lib.rs"

[[bin]]
name = "phonemizer-worker"
path = "src/phonemizer_worker.rs"
